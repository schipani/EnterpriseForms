# Stage A security qualification gate (ADR-PB-003 Level A).
# Brings up the disposable security-test stack (two PostgreSQL 18 clusters, SpiceDB, Vault Transit dev, Azurite archive
# double, Authorization Authority, business API, attacker-sql) and runs SEC-P01..SEC-P12 against it, then validates the
# evidence manifest. Zero discovered tests is a failed run (--minimum-expected-tests). A failing or missing run never
# counts as PASS (SECURITY_VALIDATION_RUNBOOK.md §3). Manual/scheduled only; synthetic credentials only.
name: security-gate-a

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1-5"

permissions:
  contents: read

# A newer push to the same PR supersedes an obsolete run; scheduled and manual runs are never cancelled.
concurrency:
  group: security-gate-a-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-a:
    name: SEC-P01..SEC-P12 against the isolated Docker stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the security test project (zero tests must never pass silently)
        run: dotnet build tests/security/EnterpriseForms.SecurityTests/EnterpriseForms.SecurityTests.csproj -c Release
      - name: Start disposable security-test stack (synthetic credentials)
        uses: ./.github/actions/start-stack
        with:
          services: business-db authority-db spicedb vault vault-transit-init archive-store azurite authority-migrate authority business-migrate api attacker-sql
          targets: authority,api
          cache-scope: gate-a
      - name: Run Stage A adversarial tests (12 mandatory + harness guard; zero or fewer discovered tests fails)
        run: >
          dotnet test --project tests/security/EnterpriseForms.SecurityTests/EnterpriseForms.SecurityTests.csproj
          --no-build -c Release
          --results-directory artifacts/security/test-results --report-xunit-trx
          -- --minimum-expected-tests 13
      - name: Validate evidence manifest shape and digests (does not prove tests ran)
        run: python security_validation/validate_security_evidence.py artifacts/security/gate-a-evidence.json
      - name: Collect service logs (sanitized by the services; no secrets are logged)
        if: always()
        working-directory: infrastructure/docker
        run: |
          mkdir -p ../../artifacts/security/logs
          for s in authority api authority-migrate business-migrate spicedb vault archive-store; do
            docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env logs --no-color $s > ../../artifacts/security/logs/$s.log 2>&1 || true
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: gate-a-evidence
          path: artifacts/security
          if-no-files-found: error
      - name: Tear down
        if: always()
        working-directory: infrastructure/docker
        run: docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env down -v --remove-orphans
