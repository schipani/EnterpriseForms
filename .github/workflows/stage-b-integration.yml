# Stage B integration — RELEASE-ONLY (permanent owner policy C-131, docs/testing/STAGE_B_RELEASE_ONLY_POLICY.md).
#
# Stage B runs ONLY when the owner explicitly authorizes release testing and someone starts this workflow by hand
# (workflow_dispatch). It has no push, pull-request, schedule, tag, release or workflow_call trigger, and no other workflow
# invokes it. Ordinary development, pull requests and feature acceptance never run it.
#
# What it runs: the Stage B integration groups of tests/integration/EnterpriseForms.StageBTests/stage-b-groups.json (all seven,
# or the groups selected below), each on its own runner and freshly started clean stack, plus (optionally) the browser
# end-to-end job. Each group keeps its own test results, logs and artifacts, so a failed group can be rerun on its own ("Re-run
# failed jobs", or a new dispatch naming only that group). Zero discovered tests is a failed run; nothing is skipped silently.
#
# Owner-only execution is NOT enforced by workflow_dispatch alone (anyone with write access can dispatch). The `plan` job runs in
# the GitHub environment `stage-b-release`; when the owner configures that environment with required reviewers (repository
# Settings > Environments), every run waits for the owner's approval before any stack starts. Until then the environment only
# records the deployment. See the policy document for the required repository-administration action.
name: stage-b-integration

on:
  workflow_dispatch:
    inputs:
      release_authorization:
        description: "Owner release-testing authorization reference (for example the decision-log id authorizing this Stage B run). Required."
        required: true
        type: string
      groups:
        description: "Stage B groups: 'all', or a comma-separated list of group names from stage-b-groups.json"
        required: true
        default: all
        type: string
      browser:
        description: "Also run the Stage B browser end-to-end job"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Release runs are never cancelled by a newer run.
concurrency:
  group: stage-b-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Plan: record the owner's authorization, build once, discover every Stage B test, prove the group manifest assigns each test
  # class to exactly one group (a new, unassigned, duplicated, stale or empty group fails here, before any stack is started), and
  # emit the matrix of the SELECTED groups. The manifest stays the single source of truth.
  plan:
    name: Stage B integration plan (release authorization, test discovery and group coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: stage-b-release
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      all_groups: ${{ steps.plan.outputs.all_groups }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
      STAGE_B_GROUPS: ${{ inputs.groups }}
      BROWSER_SELECTED: ${{ inputs.browser }}
      RUN_ACTOR: ${{ github.actor }}
      RUN_REF: ${{ github.ref_name }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Record the owner's release-testing authorization (a run without one is refused)
        run: |
          if ! printf '%s' "$RELEASE_AUTHORIZATION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9 ._:/#()-]{2,119}$'; then
            echo "A release-testing authorization reference (3..120 characters) is required: Stage B is release-only (C-131)." >&2
            exit 1
          fi
          {
            echo "### Stage B release run"
            echo "- Authorization reference: \`$RELEASE_AUTHORIZATION\`"
            echo "- Groups: \`$STAGE_B_GROUPS\`; browser end-to-end: \`$BROWSER_SELECTED\`"
            echo "- Started by: \`$RUN_ACTOR\` on \`$RUN_REF\` at \`$RUN_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the Stage B integration test project
        run: dotnet build tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj -c Release
      - name: Checker self-tests
        run: python -m unittest scripts/ci/test_stage_b_groups.py
      - name: Discover every test, verify the group manifest covers each exactly once, select the requested groups
        id: plan
        run: |
          set -o pipefail
          mkdir -p artifacts/stage-b-plan
          dotnet test --project tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj --no-build -c Release --list-tests > artifacts/stage-b-plan/all-tests.txt
          python scripts/ci/stage_b_groups.py plan --list artifacts/stage-b-plan/all-tests.txt --groups "$STAGE_B_GROUPS" --matrix-out artifacts/stage-b-plan/matrix.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "matrix=$(cat artifacts/stage-b-plan/matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s' "$STAGE_B_GROUPS" | tr -d ' ')" = "all" ]; then echo "all_groups=true" >> "$GITHUB_OUTPUT"; else echo "all_groups=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: stage-b-plan
          path: artifacts/stage-b-plan
          if-no-files-found: error

  # One shard per selected group: own runner, own freshly started clean stack, only that group's test classes. fail-fast is off so
  # a failed group never cancels the others and every group reports independently.
  integration-shard:
    name: Stage B integration shard (${{ matrix.group }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GROUP: ${{ matrix.group }}
      EVIDENCE: artifacts/stage-b/${{ matrix.group }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the Stage B integration test project (zero tests must never pass silently)
        run: dotnet build tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj -c Release
      # RC19 runs `dotnet ef migrations script` against the Infrastructure project in a subprocess. dotnet-ef builds with
      # --no-restore, and the test project does not reference Infrastructure, so its project.assets.json would not exist on a
      # fresh runner (NETSDK1004). Restore it here, with the same pinned package versions; no test or assertion is changed.
      - name: Restore the Infrastructure project for the dotnet-ef subprocess used by RC19
        run: dotnet restore src/backend/EnterpriseForms.Infrastructure/EnterpriseForms.Infrastructure.csproj
      - name: Discover this group's tests (an empty or mismatched selection fails before the stack starts)
        run: |
          mkdir -p "$EVIDENCE"
          FILTER=$(python scripts/ci/stage_b_groups.py filter "$GROUP")
          dotnet test --project tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj --no-build -c Release --list-tests -- --filter-class $FILTER > "$EVIDENCE/group-tests.txt"
          COUNT=$(grep -cE "^\s+EnterpriseForms\.StageBTests\.Tests\." "$EVIDENCE/group-tests.txt" || true)
          echo "group $GROUP discovers $COUNT tests"
          [ "$COUNT" -gt 0 ]
          echo "EXPECTED_TESTS=$COUNT" >> "$GITHUB_ENV"
      - name: Start the disposable stack with Stage B services (synthetic credentials)
        uses: ./.github/actions/start-stack
        with:
          early-services: clamav
          cache-scope: stage-b
      - name: Run this group's Stage B integration tests
        run: |
          FILTER=$(python scripts/ci/stage_b_groups.py filter "$GROUP")
          dotnet test --project tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj \
            --no-build -c Release --results-directory "$EVIDENCE/test-results" --report-xunit-trx \
            -- --minimum-expected-tests "$EXPECTED_TESTS" --filter-class $FILTER
      - name: Verify the executed population equals the group's expected population (never trusts the exit code)
        if: always()
        run: |
          set -o pipefail
          # uniquely named result file per group
          for f in "$EVIDENCE"/test-results/*.trx; do if [ -e "$f" ]; then mv "$f" "$EVIDENCE/test-results/$GROUP.trx"; fi; done
          python scripts/ci/stage_b_groups.py verify-group --group "$GROUP" --list "$EVIDENCE/group-tests.txt" --results "$EVIDENCE/test-results" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Slowest tests (timing visibility only)
        if: always()
        run: python scripts/ci/summarize_trx.py "$EVIDENCE/test-results"
      - name: Collect service logs (sanitized by the services; no secrets are logged)
        if: always()
        working-directory: infrastructure/docker
        run: |
          mkdir -p "../../$EVIDENCE/logs"
          for s in authority api worker clamav business-migrate; do
            docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env logs --no-color $s > "../../$EVIDENCE/logs/$s.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: stage-b-evidence-${{ matrix.group }}
          path: artifacts/stage-b/${{ matrix.group }}
          if-no-files-found: error
      - name: Tear down
        if: always()
        working-directory: infrastructure/docker
        run: docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env down -v --remove-orphans

  # Aggregate. For a run of all groups: every discovered test ran exactly once, passed, in its assigned group, with the total at
  # least the baseline (verify-all). For a selection: each selected group's executed population equals its expected population and
  # passed (verify-group per group). Never relies on exit codes; missing, stale, empty or failed results fail.
  integration:
    name: Stage B integration tests (real stack)
    needs: [plan, integration-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALL_GROUPS: ${{ needs.plan.outputs.all_groups }}
      MATRIX: ${{ needs.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stage-b-plan
          path: plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: stage-b-evidence-*
          path: shards
      - name: Every selected test executed exactly once and passed, in its group
        if: always()
        run: |
          set -o pipefail
          if [ "$ALL_GROUPS" = "true" ]; then
            python scripts/ci/stage_b_groups.py verify-all --list plan/all-tests.txt --results shards | tee -a "$GITHUB_STEP_SUMMARY"
          else
            status=0
            for g in $(printf '%s' "$MATRIX" | python -c "import json,sys; print(' '.join(i['group'] for i in json.load(sys.stdin)['include']))"); do
              python scripts/ci/stage_b_groups.py verify-group --group "$g" --list "shards/stage-b-evidence-$g/group-tests.txt" --results "shards/stage-b-evidence-$g/test-results" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            done
            echo "Partial Stage B selection: groups not selected were not run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
      - name: Per-group slowest tests
        if: always()
        run: python scripts/ci/summarize_trx.py shards --top 10
      - name: Plan and every shard must have succeeded (skipped, cancelled or failed all fail this gate)
        if: always()
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.integration-shard.result }}
        run: |
          echo "plan=$PLAN shards=$SHARDS"
          [ "$PLAN" = "success" ] && [ "$SHARDS" = "success" ]

  browser:
    name: Stage B browser end-to-end (real stack)
    needs: plan
    if: ${{ inputs.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Phase C5 (D10): contributor writes are OFF by default in every profile; only this disposable browser stack turns them
      # on so the contributor experience is exercised end to end. The integration job keeps the default and toggles them
      # per test through the Testing-only operator override.
      AUTHORITY_SHARE_CONTRIBUTOR_WRITES_ENABLED: "true"
      EXPECT_CONTRIBUTOR_WRITES: "true"   # contributor-writes.spec.ts fails if the Authority reports otherwise
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Start the disposable stack with Stage B services (synthetic credentials)
        uses: ./.github/actions/start-stack
        with:
          early-services: clamav
          cache-scope: stage-b
      # Browser specs that drive the isolated Platform Console (owner-recovery-objection) sign in as a synthetic console operator. The
      # two-operator registration ceremony lives in the .NET harness, so run exactly that one idempotent test before Playwright.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Register the synthetic Platform Console operators (harness ceremony; idempotent)
        run: >
          dotnet test --project tests/integration/EnterpriseForms.StageBTests/EnterpriseForms.StageBTests.csproj -c Release
          -- --filter-method "*RegisterTheConsoleOperatorsForBrowserSpecs" --minimum-expected-tests 1
      - name: Frontend install
        working-directory: src/frontend
        run: npm ci --ignore-scripts
      - name: Resolve Playwright version
        id: playwright
        working-directory: src/frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        working-directory: src/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser-test isolation regression (misrouted base URL, occupied port, persistent endpoint → refused before any write)
        working-directory: src/frontend
        env:
          API_TARGET: http://127.0.0.1:5180
          E2E_EXPECTED_STACK_IDENTITY: enterpriseforms-security-test
        run: node scripts/e2e-isolation-regression.mjs
      - name: Browser end-to-end Accused workflow (dedicated Vite server → security-test API on 5180; identity verified first)
        working-directory: src/frontend
        env:
          API_TARGET: http://127.0.0.1:5180
          E2E_EXPECTED_STACK_IDENTITY: enterpriseforms-security-test
        run: npx playwright test
      - name: Collect service logs (sanitized by the services; no secrets are logged)
        if: always()
        working-directory: infrastructure/docker
        run: |
          mkdir -p ../../artifacts/stage-b/logs
          for s in authority api worker clamav business-migrate; do
            docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env logs --no-color $s > ../../artifacts/stage-b/logs/$s.log 2>&1 || true
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: stage-b-browser-evidence
          path: artifacts/stage-b
          if-no-files-found: error
      - name: Tear down
        if: always()
        working-directory: infrastructure/docker
        run: docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env down -v --remove-orphans

  stage-b:
    name: Designer, parent-child, documents (real ClamAV), authorization, tamper regression, browser e2e
    needs: [integration, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The integration aggregate and (when selected) the browser job must have executed and succeeded
        env:
          INTEGRATION: ${{ needs.integration.result }}
          BROWSER: ${{ needs.browser.result }}
          BROWSER_SELECTED: ${{ inputs.browser }}
        run: |
          echo "integration=$INTEGRATION browser=$BROWSER browser_selected=$BROWSER_SELECTED"
          [ "$INTEGRATION" = "success" ] || exit 1
          if [ "$BROWSER_SELECTED" = "true" ]; then [ "$BROWSER" = "success" ]; else echo "Browser end-to-end not selected for this release run."; fi
