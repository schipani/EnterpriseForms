# Targeted hosted browser verification of ONE named Playwright spec at ONE exact, signed commit (C8 M4-5).
#
# This is the hosted equivalent of the focused development test `scripts/dev/test.ps1 -Level 2 -Spec <name>`, which the Stage B
# release-only policy (C-131, docs/testing/STAGE_B_RELEASE_ONLY_POLICY.md §1) classes as focused testing, NOT Stage B. It runs no
# Stage B integration group and no other spec, and it does not replace or invoke the stage-b-integration workflow. Stage B stays
# release-only and is still started only through stage-b-integration.yml.
#
# Started by hand only (workflow_dispatch): no push, pull-request, schedule, tag, release or workflow_call trigger, and no other
# workflow invokes it. Dispatch it from main (`--ref main`) and name the commit to test; the workflow file comes from main, and
# everything it tests (application, specs, stack definition, isolation scripts) comes from that exact commit.
#
# Owner approval: the single job runs in the GitHub environment `targeted-browser-verification`, which requires the owner's review
# and only admits runs from main. Nothing (checkout, stack, browser) starts before that approval.
#
# The spec input is a closed list. Adding a spec is a reviewed change to this file: a new option, its file and its exact expected
# test count. A run passes only when JUnit shows exactly that many tests executed, none failed and none skipped.
name: targeted-browser-spec
run-name: "Targeted browser spec ${{ inputs.spec }} at ${{ inputs.commit_sha }} (${{ inputs.authorization }})"

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Owner authorization reference for this verification run (for example a decision-log id). Required."
        required: true
        type: string
      commit_sha:
        description: "Full 40-character commit SHA to test; it must be the current, signed head of the spec's expected branch"
        required: true
        type: string
      spec:
        description: "Playwright spec to run (closed list)"
        required: true
        type: choice
        options:
          - security-audit

permissions:
  contents: read

# A verification run is never cancelled by a newer one.
concurrency:
  group: targeted-browser-spec-${{ inputs.spec }}
  cancel-in-progress: false

jobs:
  verify:
    name: Targeted browser spec (${{ inputs.spec }}) at the exact signed commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: targeted-browser-verification
    env:
      AUTHORIZATION: ${{ inputs.authorization }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      SPEC: ${{ inputs.spec }}
      RUN_ACTOR: ${{ github.actor }}
      RUN_REF: ${{ github.ref_name }}
      EVIDENCE: artifacts/stage-b
    steps:
      - name: Validate the inputs and resolve the spec's fixed expectations (a run without them is refused)
        run: |
          if ! printf '%s' "$AUTHORIZATION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9 ._:/#()-]{2,119}$'; then
            echo "An owner authorization reference (3..120 characters) is required." >&2; exit 1
          fi
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-character lowercase hexadecimal commit SHA." >&2; exit 1
          fi
          if [ "$RUN_REF" != "main" ]; then
            echo "Dispatch this workflow from main (--ref main); it was started on '$RUN_REF'." >&2; exit 1
          fi
          case "$SPEC" in
            security-audit)
              { echo "SPEC_FILE=e2e/security-audit.spec.ts"; echo "SPEC_CLASSNAME=security-audit.spec.ts"
                echo "EXPECTED_TESTS=11"; echo "EXPECTED_BRANCH=phase-c8/m4-5-accessibility-review"; } >> "$GITHUB_ENV" ;;
            *) echo "Unknown spec '$SPEC'." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: HEAD is exactly the requested commit
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD=$HEAD_SHA requested=$COMMIT_SHA"
          [ "$HEAD_SHA" = "$COMMIT_SHA" ]
      - name: GitHub reports the commit's signature as verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFIED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.verified')
          REASON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq '.commit.verification.reason')
          echo "verified=$VERIFIED reason=$REASON"
          if [ "$VERIFIED" != "true" ] || [ "$REASON" != "valid" ]; then
            echo "The commit's signature is not verified by GitHub." >&2; exit 1
          fi
          echo "SIGNATURE_REASON=$REASON" >> "$GITHUB_ENV"
      - name: The commit is the current head of the spec's expected branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/branches/$EXPECTED_BRANCH" --jq '.commit.sha')
          echo "$EXPECTED_BRANCH head=$BRANCH_HEAD requested=$COMMIT_SHA"
          [ "$BRANCH_HEAD" = "$COMMIT_SHA" ]
      - name: Record what is being verified
        run: |
          mkdir -p "$EVIDENCE"
          python3 -I - "$EVIDENCE/targeted-verification.json" <<'PY'
          import json, os, sys
          keys = ["AUTHORIZATION", "COMMIT_SHA", "SPEC", "SPEC_FILE", "EXPECTED_TESTS", "EXPECTED_BRANCH", "SIGNATURE_REASON",
                  "RUN_ACTOR", "RUN_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_SHA"]
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({k: os.environ.get(k) for k in keys}, f, indent=2)
          PY
          {
            echo "### Targeted browser verification"
            echo "- Authorization reference: \`$AUTHORIZATION\`"
            echo "- Spec: \`$SPEC_FILE\` (expected $EXPECTED_TESTS tests, project chromium-desktop)"
            echo "- Commit: \`$COMMIT_SHA\`, signature \`$SIGNATURE_REASON\`, head of \`$EXPECTED_BRANCH\`"
            echo "- Started by: \`$RUN_ACTOR\` on \`$RUN_REF\` (workflow file at \`$GITHUB_WORKFLOW_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the disposable security-test stack (synthetic credentials, clean volumes)
        uses: ./.github/actions/start-stack
        with:
          early-services: clamav
          cache-scope: targeted-browser
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Frontend install
        working-directory: src/frontend
        run: npm ci --ignore-scripts
      - name: Resolve Playwright version
        id: playwright
        working-directory: src/frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        working-directory: src/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser-test isolation regression (misrouted base URL, occupied port, persistent endpoint → refused before any write)
        working-directory: src/frontend
        env:
          API_TARGET: http://127.0.0.1:5180
          E2E_EXPECTED_STACK_IDENTITY: enterpriseforms-security-test
        run: node scripts/e2e-isolation-regression.mjs
      - name: The selection is exactly the spec's expected tests (before anything runs)
        working-directory: src/frontend
        run: |
          set -o pipefail
          npx playwright test "$SPEC_FILE" --project=chromium-desktop --list --reporter=list | tee "../../$EVIDENCE/selected-tests.txt"
          LISTED=$(grep -cE "^\s+\[chromium-desktop\] › $SPEC_CLASSNAME:" "../../$EVIDENCE/selected-tests.txt" || true)
          echo "listed=$LISTED expected=$EXPECTED_TESTS"
          [ "$LISTED" = "$EXPECTED_TESTS" ]
          # --list also writes the JUnit report (every test as skipped); remove it so only the real run's report is judged.
          rm -f "../../$EVIDENCE/playwright-junit.xml"
      - name: Run the spec (dedicated Vite server → security-test API on 5180; identity verified first)
        id: spec
        working-directory: src/frontend
        env:
          API_TARGET: http://127.0.0.1:5180
          E2E_EXPECTED_STACK_IDENTITY: enterpriseforms-security-test
        run: npx playwright test "$SPEC_FILE" --project=chromium-desktop
      - name: JUnit shows exactly the expected tests executed, zero failed and zero skipped (never trusts the exit code)
        if: ${{ !cancelled() && steps.spec.outcome != 'skipped' }}
        run: |
          set -o pipefail
          python3 -I - "$EVIDENCE/playwright-junit.xml" "$EXPECTED_TESTS" "$SPEC_CLASSNAME" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          import xml.etree.ElementTree as ET
          path, expected, classname = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          try:
              root = ET.parse(path).getroot()
          except (OSError, ET.ParseError) as error:
              print(f"FAIL  no readable JUnit report at {path}: {error}")
              sys.exit(1)
          cases = list(root.iter("testcase"))
          failed = sum(1 for c in cases if c.find("failure") is not None or c.find("error") is not None)
          skipped = sum(1 for c in cases if c.find("skipped") is not None)
          executed = len(cases) - skipped
          problems = []
          if len(cases) != expected:
              problems.append(f"{len(cases)} test cases reported, expected exactly {expected}")
          if failed:
              problems.append(f"{failed} failed")
          if skipped:
              problems.append(f"{skipped} skipped")
          for attribute, wanted in (("tests", str(expected)), ("failures", "0"), ("errors", "0"), ("skipped", "0")):
              if root.get(attribute) != wanted:
                  problems.append(f"report attribute {attribute}={root.get(attribute)!r}, expected {wanted!r}")
          strangers = sorted({c.get("classname") for c in cases} - {classname}, key=str)
          if strangers:
              problems.append(f"test cases from other specs: {strangers}")
          for problem in problems:
              print(f"FAIL  {problem}")
          for case in cases:
              outcome = "failed" if case.find("failure") is not None or case.find("error") is not None else "skipped" if case.find("skipped") is not None else "passed"
              print(f"- {outcome}: {case.get('name')}")
          print(f"{'PASS' if not problems else 'FAIL'}  executed={executed} failed={failed} skipped={skipped} expected={expected}")
          sys.exit(1 if problems else 0)
          PY
      - name: Collect service logs (sanitized by the services; no secrets are logged)
        if: always()
        run: |
          mkdir -p "$EVIDENCE/logs"
          if [ -f infrastructure/docker/.env ]; then
            cd infrastructure/docker
            for s in authority api worker clamav business-migrate; do
              docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env logs --no-color $s > "../../$EVIDENCE/logs/$s.log" 2>&1 || true
            done
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: targeted-browser-evidence-${{ inputs.spec }}
          path: artifacts/stage-b
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: |
          if [ -f infrastructure/docker/.env ]; then
            cd infrastructure/docker
            docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env down -v --remove-orphans
          fi
