# FOR LOCAL DEVELOPMENT ONLY. Vault dev mode has no persistence or security isolation.
services:
  vault:
    image: hashicorp/vault:1.20
    command: server -dev -dev-root-token-id=dev-only-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 15
