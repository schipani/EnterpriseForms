# Disposable integration-test environment: no host ports, ephemeral tmpfs storage, Testing environment names.
# Never shares volumes with the development profile, so tests cannot erase developer data.
services:
  business-db:
    tmpfs: [/var/lib/postgresql]
  authority-db:
    tmpfs: [/var/lib/postgresql]
  spicedb-db:
    tmpfs: [/var/lib/postgresql]
  azurite:
    tmpfs: [/data]
  archive-store:
    tmpfs: [/data]
  journal-verification-store:
    tmpfs: [/data]
  archive-provision:
    # SEC-BL-01 WP-5a.1: provision this disposable archive before the Authority starts (refuses anything not demonstrably new).
    profiles: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
  authority:
    depends_on:
      archive-provision:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
  worker:
    environment:
      DOTNET_ENVIRONMENT: Testing
  web:
    profiles: [never]   # the SPA is not part of API integration runs
