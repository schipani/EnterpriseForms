# Destructive security-test environment (ADR-PB-003 Level A). Dedicated project name, ephemeral storage,
# Testing environment, fault injection enabled in the authority, loopback host ports for the test harness, and an
# "attacker" SQL client attached ONLY to business-net with BusinessDb ADMIN credentials (the hostile DBA of the threat model).
# SEC-P01..SEC-P12 harnesses use this container to perform hostile writes; it must be unable to reach
# authority-db, spicedb, vault or archive-store (asserted by SEC-P11, not assumed from this file).
name: enterpriseforms-sectest
services:
  business-db:
    tmpfs: [/var/lib/postgresql]
  authority-db:
    tmpfs: [/var/lib/postgresql]
  spicedb-db:
    tmpfs: [/var/lib/postgresql]
  azurite:
    tmpfs: [/data]
  archive-store:
    tmpfs: [/data]
  authority:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      FaultInjection__Enabled: "true"
      # C7 M4 adversarial tests only: a test may recreate the authority with a lower migration-catalogue ceiling or a shorter
      # migration snapshot lifetime (defaults are the production values) and restores them afterwards.
      Catalogue__MaximumMigrationEntries: ${AUTHORITY_TESTING_MAX_MIGRATION_ENTRIES:-50000}
      Catalogue__MigrationSnapshotLifetimeSeconds: ${AUTHORITY_TESTING_MIGRATION_SNAPSHOT_SECONDS:-900}
      # C7 M4 incident correction: identity of this isolated stack (Testing only; the browser-test guard requires it from both
      # the API and the Authority). The persistent development stack never sets it and runs Development.
      Testing__StackIdentity: enterpriseforms-security-test
      # C-28: a small lookup page makes every multi-record discovery test cross SpiceDB cursor pages (production keeps 1000).
      SpiceDb__LookupPageSize: "20"
      # Phase C7 OD-1: synthetic field-protection verifier credential for this isolated stack only (TestIdentity.VerifierToken
      # mirrors it). Other stacks set nothing, so the migration catalogue is unreachable there (fail closed).
      Identity__Verifier__Issuer: enterpriseforms-field-protection-verifier
      Identity__Verifier__Audience: authorization-authority-verifier
      Identity__Verifier__SharedKeyBase64: dmVyaWZpZXItdGVzdC1vbmx5LXNoYXJlZC1rZXktMDAwMDAwMDAw
      # Phase C8 AC-9: synthetic team-membership reconciler credential for this isolated stack only (TestIdentity.ReconcilerToken
      # mirrors it). RC-25 may recreate the authority with RECONCILER_TESTING_AUTHORITY_KEY set to a rotated key.
      Identity__Reconciler__Issuer: enterpriseforms-team-membership-reconciler
      Identity__Reconciler__Audience: authorization-authority-reconciler
      Identity__Reconciler__SharedKeyBase64: ${RECONCILER_TESTING_AUTHORITY_KEY:-cmVjb25jaWxlci10ZXN0LW9ubHktc2hhcmVkLWtleS0wMDAwMDA=}
      # Phase C7 M2 (AC-6, OD-7): development-only synthetic step-up for search approvals. The Authority refuses to start
      # with this outside Development/Testing or without the synthetic TestIdentityProvider; every other stack leaves it
      # unset (Unavailable), so approvals are refused there until PB-08 step-up exists.
      FieldSearch__ApprovalStepUp: SyntheticDevelopment
      # DR-C7-3: development-only synthetic operator approvers for first/recovery Security Administrators on this isolated
      # stack (public keys only; TestIdentity holds the matching synthetic private keys). Startup refuses this mode outside
      # Development/Testing; every other stack leaves it unset (Unavailable), so operator appointments are refused there.
      OperatorApprovals__Mode: SyntheticDevelopment
      OperatorApprovals__Approvers__0__ApproverId: test-synthetic-approver-1
      OperatorApprovals__Approvers__0__PublicKeyBase64: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaBC2VnfuPFENfDfpRL5gG6ZhYCDxOJB/Mj8yXvw2PxusfBRgV1d1wjvy/HP67VIRCfW0h67+hMuHCFx7rV/qDQ==
      OperatorApprovals__Approvers__1__ApproverId: test-synthetic-approver-2
      OperatorApprovals__Approvers__1__PublicKeyBase64: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4VrwCbiOwMrK+U4F07V5aaLnSTrgfBh0p7h9aapL/IuZmvII/Yvy9nX/Iz6vjVDz465DRHe0dWZeILR4h/E/Ew==
    restart: unless-stopped          # SEC-P09: the process terminates at the armed crash point and is restarted here
    ports: ["127.0.0.1:5190:8080"]   # harness reaches the operator plane and internal contract directly (loopback only)
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      # Phase C6 AC-2 adversarial tests only: skip the business lifecycle lock on the contributor path so the Authority's own
      # lock is what is exercised. Off unless a test recreates the api container with the variable set; Testing-only (startup guard).
      Testing__BypassContributorLifecycleLock: ${API_TESTING_BYPASS_CONTRIBUTOR_LIFECYCLE_LOCK:-false}
      # F-C7-01 fault-injection tests: requests may arm one write checkpoint with X-Testing-Fault (Testing-only; refused elsewhere).
      Testing__WriteFaultInjection: "true"
      # G23: both API instances decrypt the same session cookies (one key ring); session validity is decided by the Authority.
      DataProtection__KeyRingDirectory: /keyring
      # Phase C7 M3: verified field-value search execution (fail-closed gate; refused at startup outside Development/Testing).
      FieldSearch__ExecutionEnabled: "true"
      Testing__StackIdentity: enterpriseforms-security-test
      # Phase C8 (D8-16): shortened reconciliation windows, permitted in Testing only (the hosts refuse them elsewhere).
      TeamMembershipReconciliation__InFlightWindowSeconds: "6"
      TeamMembershipReconciliation__BackoffSeconds: "1"
      TeamMembershipReconciliation__BackoffCapSeconds: "3"
      TeamMembershipReconciliation__NeedsAttentionSeconds: "20"
      TeamMembershipReconciliation__LateCommitSweepIntervalSeconds: "5"
    volumes:
      - api-keyring:/keyring
    ports: ["127.0.0.1:5180:8080"]
  # G23: a second business API instance behind the "same front end" (same key ring), so the integration suite can prove that a
  # session revoked through one instance is refused by the other. Request handling only (no in-process background loops).
  api-secondary:
    extends:
      file: compose.yaml
      service: api
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      DataProtection__KeyRingDirectory: /keyring
      FieldSearch__ExecutionEnabled: "true"
      Testing__StackIdentity: enterpriseforms-security-test
      TeamMembershipReconciliation__InFlightWindowSeconds: "6"
      TeamMembershipReconciliation__BackoffSeconds: "1"
      TeamMembershipReconciliation__BackoffCapSeconds: "3"
      TeamMembershipReconciliation__NeedsAttentionSeconds: "20"
      TeamMembershipReconciliation__LateCommitSweepIntervalSeconds: "5"
    volumes:
      - api-keyring:/keyring
    ports: ["127.0.0.1:5181:8080"]
    depends_on:
      api:
        condition: service_healthy
      # Starts after the one-shot seed; as a completed dependency it also keeps `up --wait` from treating the seed's
      # normal exit as a failure (the second instance's later health check would otherwise race the seed's exit).
      dev-seed:
        condition: service_completed_successfully
  worker:
    environment:
      DOTNET_ENVIRONMENT: Testing
      # C7 M4 key-outage test only: recreated with "Unconfigured" (fail-closed key provider) and restored afterwards.
      Encryption__KeyProvider: ${WORKER_TESTING_KEY_PROVIDER:-LocalDevelopment}
      # Phase C7 M4 (OD-1): the same synthetic field-protection verifier credential as the authority above, for the Worker
      # only (the API never gets it). TestIdentity.VerifierToken mirrors it.
      ProtectionVerifier__Issuer: enterpriseforms-field-protection-verifier
      ProtectionVerifier__Audience: authorization-authority-verifier
      ProtectionVerifier__SharedKeyBase64: dmVyaWZpZXItdGVzdC1vbmx5LXNoYXJlZC1rZXktMDAwMDAwMDAw
      # Phase C8 AC-9: the synthetic team-membership reconciler credential (Worker only; the API never gets it, RC-26). RC-25
      # may recreate the worker with RECONCILER_TESTING_WORKER_KEY set to a key the Authority does not accept.
      TeamMembershipReconciler__Issuer: enterpriseforms-team-membership-reconciler
      TeamMembershipReconciler__Audience: authorization-authority-reconciler
      TeamMembershipReconciler__SharedKeyBase64: ${RECONCILER_TESTING_WORKER_KEY:-cmVjb25jaWxlci10ZXN0LW9ubHktc2hhcmVkLWtleS0wMDAwMDA=}
      # Phase C8 (D8-16): shortened reconciliation windows, Testing only.
      TeamMembershipReconciliation__InFlightWindowSeconds: "6"
      TeamMembershipReconciliation__BackoffSeconds: "1"
      TeamMembershipReconciliation__BackoffCapSeconds: "3"
      TeamMembershipReconciliation__NeedsAttentionSeconds: "20"
      TeamMembershipReconciliation__LateCommitSweepIntervalSeconds: "5"
  web:
    profiles: [never]
  attacker-sql:
    image: postgres:18.0
    entrypoint: ["sleep", "infinity"]
    environment:
      PGHOST: business-db
      PGDATABASE: ${BUSINESS_DB_NAME:?set in .env}
      PGUSER: ${BUSINESS_DB_ADMIN_USER:?set in .env}
      PGPASSWORD: ${BUSINESS_DB_ADMIN_PASSWORD:?set in .env}
    networks: [business-net]
    depends_on:
      business-db:
        condition: service_healthy
volumes:
  # Ephemeral (tmpfs) key ring shared by the two API containers; owned by the runtime image's non-root user (APP_UID 1654).
  api-keyring:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1654,gid=1654,mode=0700"
