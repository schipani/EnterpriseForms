# Destructive security-test environment (ADR-PB-003 Level A). Dedicated project name, ephemeral storage,
# Testing environment, fault injection enabled in the authority, loopback host ports for the test harness, and an
# "attacker" SQL client attached ONLY to business-net with BusinessDb ADMIN credentials (the hostile DBA of the threat model).
# SEC-P01..SEC-P12 harnesses use this container to perform hostile writes; it must be unable to reach
# authority-db, spicedb, vault or archive-store (asserted by SEC-P11, not assumed from this file).
name: enterpriseforms-sectest
services:
  business-db:
    tmpfs: [/var/lib/postgresql]
  authority-db:
    tmpfs: [/var/lib/postgresql]
  spicedb-db:
    tmpfs: [/var/lib/postgresql]
  azurite:
    tmpfs: [/data]
  archive-store:
    tmpfs: [/data]
  authority:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      FaultInjection__Enabled: "true"
      # C-28: a small lookup page makes every multi-record discovery test cross SpiceDB cursor pages (production keeps 1000).
      SpiceDb__LookupPageSize: "20"
      # Phase C7 OD-1: synthetic field-protection verifier credential for this isolated stack only (TestIdentity.VerifierToken
      # mirrors it). Other stacks set nothing, so the migration catalogue is unreachable there (fail closed).
      Identity__Verifier__Issuer: enterpriseforms-field-protection-verifier
      Identity__Verifier__Audience: authorization-authority-verifier
      Identity__Verifier__SharedKeyBase64: dmVyaWZpZXItdGVzdC1vbmx5LXNoYXJlZC1rZXktMDAwMDAwMDAw
    restart: unless-stopped          # SEC-P09: the process terminates at the armed crash point and is restarted here
    ports: ["127.0.0.1:5190:8080"]   # harness reaches the operator plane and internal contract directly (loopback only)
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      # Phase C6 AC-2 adversarial tests only: skip the business lifecycle lock on the contributor path so the Authority's own
      # lock is what is exercised. Off unless a test recreates the api container with the variable set; Testing-only (startup guard).
      Testing__BypassContributorLifecycleLock: ${API_TESTING_BYPASS_CONTRIBUTOR_LIFECYCLE_LOCK:-false}
      # G23: both API instances decrypt the same session cookies (one key ring); session validity is decided by the Authority.
      DataProtection__KeyRingDirectory: /keyring
    volumes:
      - api-keyring:/keyring
    ports: ["127.0.0.1:5180:8080"]
  # G23: a second business API instance behind the "same front end" (same key ring), so the integration suite can prove that a
  # session revoked through one instance is refused by the other. Request handling only (no in-process background loops).
  api-secondary:
    extends:
      file: compose.yaml
      service: api
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      DataProtection__KeyRingDirectory: /keyring
    volumes:
      - api-keyring:/keyring
    ports: ["127.0.0.1:5181:8080"]
    depends_on:
      api:
        condition: service_healthy
      # Starts after the one-shot seed; as a completed dependency it also keeps `up --wait` from treating the seed's
      # normal exit as a failure (the second instance's later health check would otherwise race the seed's exit).
      dev-seed:
        condition: service_completed_successfully
  worker:
    environment:
      DOTNET_ENVIRONMENT: Testing
  web:
    profiles: [never]
  attacker-sql:
    image: postgres:18.0
    entrypoint: ["sleep", "infinity"]
    environment:
      PGHOST: business-db
      PGDATABASE: ${BUSINESS_DB_NAME:?set in .env}
      PGUSER: ${BUSINESS_DB_ADMIN_USER:?set in .env}
      PGPASSWORD: ${BUSINESS_DB_ADMIN_PASSWORD:?set in .env}
    networks: [business-net]
    depends_on:
      business-db:
        condition: service_healthy
volumes:
  # Ephemeral (tmpfs) key ring shared by the two API containers; owned by the runtime image's non-root user (APP_UID 1654).
  api-keyring:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1654,gid=1654,mode=0700"
