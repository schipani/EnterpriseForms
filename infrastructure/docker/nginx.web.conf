server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # CSP is finalized with the approved token-injection design (CLAUDE-DESIGN.MD §10); baseline forbids inline script.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Same-origin /api proxied to the business API; no SPA fallback for API paths.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }

    location /health/ {
        proxy_pass http://api:8080/health/;
    }

    # Hashed static assets may be cached; the HTML shell may not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control no-store always;
        try_files $uri /index.html;
    }
}
