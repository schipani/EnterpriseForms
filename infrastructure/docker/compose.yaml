# Enterprise Forms — local trust-separated stack (ADR-PB-005, PB05_DEPLOYMENT_BLUEPRINT.md).
#
# Usage (always combine with exactly one override file):
#   development:    python scripts/devstack/devstack.py up   (persistent Vault, compose.dev-persistent.yaml; C-47)
#   retired dev:    docker compose -f compose.yaml -f compose.dev.yaml --env-file .env up -d   (in-memory Vault; do not use)
#   integration:    docker compose -f compose.yaml -f compose.integration.yaml --env-file .env up -d --wait
#   security-test:  docker compose -f compose.yaml -f compose.security-test.yaml --env-file .env up -d --wait
# Copy env.example to .env first. Values in env.example are synthetic development credentials only.
#
# Trust boundaries emulated with separate networks and credentials (NOT equivalent to production isolation):
#   business-net : business-db <-> api/worker (+ azurite document emulator)
#   trust-edge   : api/worker  -> authority (private HTTP contract only)
#   authority-net: authority <-> authority-db, spicedb, vault, archive-store   (no business service is attached)
#   web-net      : web -> api
#
# Images that two services share (authority/authority-migrate, api/business-migrate) carry one explicit tag so they are built once and
# CI can pre-build them with BuildKit layer caching (.github/actions/start-stack) without compose rebuilding them.
# Least privilege: each database has an admin (migration) identity and a runtime identity. The api/authority containers
# run with the runtime identities; one-shot *-migrate services apply EF migrations and grants with the admin identity.
name: enterpriseforms

networks:
  # Subnets are pinned so the PostgreSQL pg_hba policies can name them. authority-net is `internal`: Docker Desktop does
  # not isolate bridge networks from each other by IP (verified 2026-10-17), but internal networks are isolated.
  business-net:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  trust-edge: {}
  authority-net:
    internal: true
    ipam:
      config: [{ subnet: 172.30.1.0/24 }]
  web-net: {}

services:
  business-db:
    image: postgres:18.0
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgres/pg_hba.business.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-business-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME:?set in .env}
      POSTGRES_USER: ${BUSINESS_DB_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${BUSINESS_DB_ADMIN_PASSWORD:?set in .env}
      BUSINESS_RUNTIME_USER: ${BUSINESS_RUNTIME_USER:?set in .env}
      BUSINESS_RUNTIME_PASSWORD: ${BUSINESS_RUNTIME_PASSWORD:?set in .env}
    networks: [business-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  authority-db:
    image: postgres:18.0
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgres/pg_hba.authority.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-authority-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    environment:
      POSTGRES_DB: ${AUTHORITY_DB_NAME:?set in .env}
      POSTGRES_USER: ${AUTHORITY_DB_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${AUTHORITY_DB_ADMIN_PASSWORD:?set in .env}
      AUTHORITY_RUNTIME_USER: ${AUTHORITY_RUNTIME_USER:?set in .env}
      AUTHORITY_RUNTIME_PASSWORD: ${AUTHORITY_RUNTIME_PASSWORD:?set in .env}
    networks: [authority-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  spicedb-db:
    image: postgres:18.0
    environment:
      POSTGRES_DB: spicedb
      POSTGRES_USER: ${SPICEDB_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${SPICEDB_DB_PASSWORD:?set in .env}
    networks: [authority-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d spicedb"]
      interval: 5s
      timeout: 3s
      retries: 20

  spicedb-migrate:
    image: authzed/spicedb:v1.56.2
    command: ["migrate", "head", "--datastore-engine", "postgres", "--datastore-conn-uri", "postgres://${SPICEDB_DB_USER}:${SPICEDB_DB_PASSWORD}@spicedb-db:5432/spicedb?sslmode=disable"]
    depends_on:
      spicedb-db:
        condition: service_healthy
    networks: [authority-net]
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.56.2
    command: ["serve", "--grpc-preshared-key", "${SPICEDB_PRESHARED_KEY:?set in .env}", "--datastore-engine", "postgres", "--datastore-conn-uri", "postgres://${SPICEDB_DB_USER}:${SPICEDB_DB_PASSWORD}@spicedb-db:5432/spicedb?sslmode=disable", "--http-enabled=false"]
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    networks: [authority-net]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    # DEVELOPMENT ONLY. Vault dev mode: in-memory, unsealed, root token from .env. Never promoted beyond local.
    image: hashicorp/vault:1.20.4
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:?set in .env}", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    networks: [authority-net]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-transit-init:
    # Enables the transit secrets engine once; per-organization HMAC keys are provisioned by the authority's operator workflow.
    image: hashicorp/vault:1.20.4
    entrypoint: ["sh", "-c", "vault secrets enable -address=http://vault:8200 transit || true"]
    environment:
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
    depends_on:
      vault:
        condition: service_healthy
    networks: [authority-net]
    restart: "no"

  archive-store:
    # TEST DOUBLE for the separately administered append-only security-event archive (G14). Azurite on authority-net:
    # reachable only by the authority. Not Azure immutable storage / Confidential Ledger evidence (ADR-PB-003 Level A).
    image: mcr.microsoft.com/azure-storage/azurite:3.9.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    networks: [authority-net]

  azurite:
    # Blob emulator for the Documents feature (Phase 3A). Private container semantics are enforced by the API, not the emulator.
    image: mcr.microsoft.com/azure-storage/azurite:3.9.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    networks: [business-net]

  clamav:
    # Real malware scanner for the Documents feature (B-05). clamd INSTREAM over TCP on business-net; the API/worker never
    # release a document without a verdict from it. Signature database ships inside the image; startup takes ~30-90 s.
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMD_CONF_StreamMaxLength: 600M
      CLAMD_CONF_MaxScanSize: 600M
      CLAMD_CONF_MaxFileSize: 600M
    networks: [business-net]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dev-seed:
    # Development/Testing only: bootstraps a synthetic organization and personas through the authority OPERATOR plane and
    # writes dev-personas.json for the business API's development login. Holds the operator key; the api container does not.
    image: enterpriseforms/dev-seed:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.devseed
    environment:
      DEVSEED_AUTHORITY_BASE_ADDRESS: http://authority:8080
      DEVSEED_OPERATOR_ISSUER: ${OPERATOR_ISSUER}
      DEVSEED_OPERATOR_AUDIENCE: ${OPERATOR_AUDIENCE}
      DEVSEED_OPERATOR_SHARED_KEY_BASE64: ${OPERATOR_SHARED_KEY_BASE64}
      DEVSEED_TEST_IDP_ISSUER: ${TEST_IDP_ISSUER}
      DEVSEED_OUTPUT_PATH: /seed/dev-personas.json
      DEVSEED_ORGANIZATION_NAME: ${DEVSEED_ORGANIZATION_NAME:-Northwind Crown Office (synthetic)}
    volumes:
      - dev-seed:/seed
    depends_on:
      authority:
        condition: service_healthy
    networks: [trust-edge]
    restart: "no"

  authority-migrate:
    image: enterpriseforms/authority:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.authority
    command: ["dotnet", "AuthorizationAuthority.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__AuthorityDbMigration: Host=authority-db;Database=${AUTHORITY_DB_NAME};Username=${AUTHORITY_DB_ADMIN_USER};Password=${AUTHORITY_DB_ADMIN_PASSWORD}
      Database__RuntimeRoleName: ${AUTHORITY_RUNTIME_USER}
    depends_on:
      authority-db:
        condition: service_healthy
    networks: [authority-net]
    restart: "no"

  authority:
    image: enterpriseforms/authority:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.authority
    environment:
      ASPNETCORE_ENVIRONMENT: ${AUTHORITY_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # Phase C5 (D10): field-scoped contributor writes stay OFF unless explicitly set to exactly "true" (CI browser job only).
      Content__ShareContributorWritesEnabled: ${AUTHORITY_SHARE_CONTRIBUTOR_WRITES_ENABLED:-false}
      Signing__Provider: VaultTransit
      Signing__VaultAddress: http://vault:8200
      Signing__VaultTransit__Token: ${VAULT_DEV_ROOT_TOKEN}
      ConnectionStrings__AuthorityDb: Host=authority-db;Database=${AUTHORITY_DB_NAME};Username=${AUTHORITY_RUNTIME_USER};Password=${AUTHORITY_RUNTIME_PASSWORD}
      SpiceDb__Endpoint: spicedb:50051
      SpiceDb__PresharedKey: ${SPICEDB_PRESHARED_KEY}
      SecurityArchive__Provider: Blob
      SecurityArchive__BlobServiceUri: http://archive-store:10000/${ARCHIVE_ACCOUNT_NAME}
      SecurityArchive__AccountName: ${ARCHIVE_ACCOUNT_NAME}
      SecurityArchive__AccountKey: ${ARCHIVE_ACCOUNT_KEY}
      Identity__Workload__Issuer: ${WORKLOAD_ISSUER}
      Identity__Workload__Audience: ${WORKLOAD_AUDIENCE}
      Identity__Workload__SharedKeyBase64: ${WORKLOAD_SHARED_KEY_BASE64}
      Identity__Operator__Issuer: ${OPERATOR_ISSUER}
      Identity__Operator__Audience: ${OPERATOR_AUDIENCE}
      Identity__Operator__SharedKeyBase64: ${OPERATOR_SHARED_KEY_BASE64}
      Identity__UserAssertion__ProviderKind: TestIdentityProvider
      Identity__UserAssertion__Issuer: ${TEST_IDP_ISSUER}
      Identity__UserAssertion__Audience: ${TEST_IDP_AUDIENCE}
      Identity__UserAssertion__SharedKeyBase64: ${TEST_IDP_SHARED_KEY_BASE64}
    depends_on:
      authority-db:
        condition: service_healthy
      authority-migrate:
        condition: service_completed_successfully
      spicedb:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-transit-init:
        condition: service_completed_successfully
      archive-store:
        condition: service_started
    networks: [authority-net, trust-edge]
    healthcheck:
      test: ["CMD", "dotnet", "AuthorizationAuthority.Api.dll", "--probe", "http://127.0.0.1:8080/internal/v1/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 40

  business-migrate:
    image: enterpriseforms/api:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    command: ["dotnet", "EnterpriseForms.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__BusinessDbMigration: Host=business-db;Database=${BUSINESS_DB_NAME};Username=${BUSINESS_DB_ADMIN_USER};Password=${BUSINESS_DB_ADMIN_PASSWORD}
      Database__RuntimeRoleName: ${BUSINESS_RUNTIME_USER}
    depends_on:
      business-db:
        condition: service_healthy
    networks: [business-net]
    restart: "no"

  api:
    image: enterpriseforms/api:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: ${BUSINESS_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      TrustAuthority__BaseAddress: http://authority:8080
      TrustAuthority__WorkloadIssuer: ${WORKLOAD_ISSUER}
      TrustAuthority__WorkloadAudience: ${WORKLOAD_AUDIENCE}
      TrustAuthority__WorkloadSharedKeyBase64: ${WORKLOAD_SHARED_KEY_BASE64}
      UserAuthentication__ProviderKind: TestIdentityProvider
      UserAuthentication__Issuer: ${TEST_IDP_ISSUER}
      UserAuthentication__Audience: ${TEST_IDP_AUDIENCE}
      UserAuthentication__SharedKeyBase64: ${TEST_IDP_SHARED_KEY_BASE64}
      ConnectionStrings__BusinessDb: Host=business-db;Database=${BUSINESS_DB_NAME};Username=${BUSINESS_RUNTIME_USER};Password=${BUSINESS_RUNTIME_PASSWORD}
      Storage__Provider: AzureBlob
      Storage__BlobServiceUri: http://azurite:10000/devstoreaccount1
      Storage__AccountName: ${DOCUMENTS_ACCOUNT_NAME}
      Storage__AccountKey: ${DOCUMENTS_ACCOUNT_KEY}
      MalwareScanner__Provider: ClamAv
      MalwareScanner__Host: clamav
      MalwareScanner__Port: "3310"
      Encryption__KeyProvider: LocalDevelopment
      Encryption__LocalDevelopmentKekBase64: ${LOCAL_DEV_KEK_BASE64}
      DevelopmentIdentity__Enabled: "true"
      DevelopmentIdentity__PersonasFilePath: /seed/dev-personas.json
      DocumentProcessing__HostInProcess: "false"
    volumes:
      - dev-seed:/seed:ro
    depends_on:
      business-db:
        condition: service_healthy
      business-migrate:
        condition: service_completed_successfully
      authority:
        condition: service_healthy
    networks: [business-net, trust-edge, web-net]
    healthcheck:
      test: ["CMD", "dotnet", "EnterpriseForms.Api.dll", "--probe", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    image: enterpriseforms/worker:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: ${BUSINESS_ENVIRONMENT:-Development}
      Worker__TrustAuthorityBaseAddress: http://authority:8080
      ConnectionStrings__BusinessDb: Host=business-db;Database=${BUSINESS_DB_NAME};Username=${BUSINESS_RUNTIME_USER};Password=${BUSINESS_RUNTIME_PASSWORD}
      TrustAuthority__BaseAddress: http://authority:8080
      TrustAuthority__WorkloadIssuer: ${WORKLOAD_ISSUER}
      TrustAuthority__WorkloadAudience: ${WORKLOAD_AUDIENCE}
      TrustAuthority__WorkloadSharedKeyBase64: ${WORKLOAD_SHARED_KEY_BASE64}
      Storage__Provider: AzureBlob
      Storage__BlobServiceUri: http://azurite:10000/devstoreaccount1
      Storage__AccountName: ${DOCUMENTS_ACCOUNT_NAME}
      Storage__AccountKey: ${DOCUMENTS_ACCOUNT_KEY}
      MalwareScanner__Provider: ClamAv
      MalwareScanner__Host: clamav
      MalwareScanner__Port: "3310"
      Encryption__KeyProvider: LocalDevelopment
      Encryption__LocalDevelopmentKekBase64: ${LOCAL_DEV_KEK_BASE64}
    depends_on:
      business-db:
        condition: service_healthy
      business-migrate:
        condition: service_completed_successfully
      authority:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: [business-net, trust-edge]

  web:
    image: enterpriseforms/web:local
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    networks: [web-net]

volumes:
  dev-seed: {}
