server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Same-origin /console-api goes to the Platform Console BFF only (never the business API). Origin, cookies and Sec-Fetch-*
    # headers are forwarded unchanged so the BFF's own origin and CSRF checks decide.
    location /console-api/ {
        proxy_pass http://platform-console:8080/console-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The SPA shell is served for the /platform routes only; other paths are 404 (no business routes exist here).
    location = / {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }
    location /platform {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}
