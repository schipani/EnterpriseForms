# AuthorityDb host-based authentication (ADR-PB-005 §4, G08 defense in depth).
# Only clients on the pinned authority-net subnet may authenticate. The bridge gateway is rejected explicitly:
# Docker Desktop masquerades traffic from other bridge networks (and from the host) as the gateway address, so a
# subnet allow alone would admit cross-plane traffic. Network isolation (internal: true) is the first layer; this is the second.
local   all all                      scram-sha-256
host    all all 127.0.0.1/32         scram-sha-256
host    all all ::1/128              scram-sha-256
host    all all 172.30.1.1/32        reject
host    all all 172.30.1.0/24        scram-sha-256
host    all all 0.0.0.0/0            reject
host    all all ::/0                 reject
