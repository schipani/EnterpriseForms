# AuthorityDb host-based authentication for the persistent development stack (compose.dev-persistent.yaml, C-47).
# Same policy as ../pg_hba.authority.conf on that stack's own pinned authority-net subnet; gateway rejected.
local   all all                      scram-sha-256
host    all all 127.0.0.1/32         scram-sha-256
host    all all ::1/128              scram-sha-256
host    all all 172.31.1.1/32        reject
host    all all 172.31.1.0/24        scram-sha-256
host    all all 0.0.0.0/0            reject
host    all all ::/0                 reject
