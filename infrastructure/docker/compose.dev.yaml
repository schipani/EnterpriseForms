# SUPERSEDED for day-to-day development by compose.dev-persistent.yaml (C-47): this override keeps Vault in `-dev` mode
# (in-memory keys, lost whenever the container stops) and Azurite data in the container layer. It is kept only for the
# retired 'enterpriseforms' project. Use scripts/devstack/devstack.py; see docs/infrastructure/DEV_ENVIRONMENT_PERSISTENT_VAULT.md.
# Development overrides: loopback-only host ports for services and named volumes that survive restarts.
# Database ports are NOT published: host traffic reaches containers as the bridge gateway, which pg_hba rejects.
# Use `docker compose ... exec business-db psql -U $BUSINESS_DB_ADMIN_USER -d $BUSINESS_DB_NAME` instead.
services:
  business-db:
    volumes: [business-db-data:/var/lib/postgresql]
  authority-db:
    volumes: [authority-db-data:/var/lib/postgresql]
  spicedb-db:
    volumes: [spicedb-db-data:/var/lib/postgresql]
  archive-store:
    # SEC-BL-01 N-1 (C-155): this volume is now actually used (compose.yaml passes --location /data); before, it was mounted but the
    # archive lived in the container layer while authority-db-data persisted.
    volumes: [archive-store-data:/data]
  journal-verification-store:
    volumes: [journal-verification-store-data:/data]
  azurite:
    ports: ["127.0.0.1:10010:10000"]   # 10000 is commonly taken by other local Azurite instances
    volumes: [azurite-data:/data]
  clamav:
    ports: ["127.0.0.1:3310:3310"]
  authority:
    ports: ["127.0.0.1:5090:8080"]
  api:
    ports: ["127.0.0.1:5080:8080"]
  web:
    ports: ["127.0.0.1:8081:8080"]

volumes:
  business-db-data: {}
  authority-db-data: {}
  spicedb-db-data: {}
  archive-store-data: {}
  journal-verification-store-data: {}
  azurite-data: {}
